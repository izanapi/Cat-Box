<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
<title>CAT BOX — CB-003</title>
<style>
:root{
  --bg:#050505; --ink:#f4f4ef; --dim:#8f8f89;
  --line:rgba(244,244,239,.34); --faint:rgba(244,244,239,.10);
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--ink);font-family:"Courier New",ui-monospace,monospace}
body{-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input{font:inherit}
#app{
  width:100%;max-width:500px;min-height:100svh;margin:auto;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom));
}
header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:9px}
h1{font-weight:400;font-size:20px;letter-spacing:.24em;text-align:center;margin:0}
.sub{text-align:center;font-size:6px;color:var(--dim);letter-spacing:.18em;margin-top:3px}
.icon{height:38px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:0;font-size:14px}
.panel{border:1px solid var(--line);position:relative;background:rgba(255,255,255,.005)}
.panel:before,.panel:after{content:"";position:absolute;width:7px;height:7px;pointer-events:none}
.panel:before{left:-1px;top:-1px;border-left:1px solid var(--ink);border-top:1px solid var(--ink)}
.panel:after{right:-1px;bottom:-1px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.label{font-size:7px;letter-spacing:.16em;color:var(--dim)}

.workspace{
  display:grid;
  grid-template-columns:42% 58%;
  gap:7px;
  min-height:455px;
}
.leftStack{display:grid;grid-template-rows:1fr 1fr;gap:7px}
.gen{padding:8px;display:flex;flex-direction:column;min-width:0}
.genHead{display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:.12em}
.on{width:23px;height:13px;background:transparent;border:1px solid var(--line);position:relative}
.on i{position:absolute;width:7px;height:7px;left:2px;top:2px;background:var(--ink);transition:.15s}
.on.off i{left:12px;background:var(--dim)}
.wave{width:100%;height:44px;display:block;border:1px solid var(--faint);margin:8px 0}
.switches{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:auto}
.typeBtn{
  min-height:32px;background:transparent;color:var(--dim);border:1px solid var(--faint);
  font-size:6px;letter-spacing:.08em;padding:0 2px
}
.typeBtn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.observe{
  padding:8px;
  display:grid;
  grid-template-rows:auto 72px 1fr auto;
  min-width:0;
}
.obsTop{display:grid;grid-template-columns:1.05fr .95fr;gap:6px}
.stateBox,.probBox{border:1px solid var(--faint);padding:7px}
#stateText{font-size:12px;letter-spacing:.11em;margin-top:6px}
#stateSub{font-size:5.5px;color:var(--dim);margin-top:5px}
.prow{display:grid;grid-template-columns:21px 27px 1fr;gap:3px;align-items:center;margin-top:4px;font-size:5.5px}
.bar{height:2px;background:var(--faint)} .bar i{display:block;height:100%;background:var(--ink)}
#eye{width:100%;height:72px;display:block;margin-top:2px}
#box{width:100%;height:100%;display:block}
.observeFoot{
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  border-top:1px solid var(--faint);padding-top:6px
}
.obsTitle{font-size:7px;letter-spacing:.14em}
.obsNote{font-size:5.5px;color:var(--dim);margin-top:2px}
.pulse{display:flex;align-items:center;gap:5px;font-size:5.5px;color:var(--dim)}
.pulse i{width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:0 0 9px rgba(255,255,255,.6);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.24;box-shadow:none}}

.controls{margin-top:7px;padding:9px}
.control{margin-bottom:8px}.control:last-child{margin-bottom:0}
.row{display:flex;justify-content:space-between;align-items:end;margin-bottom:2px}
.row b{font-weight:400;font-size:7px;letter-spacing:.14em}
.row span{font-size:6px;color:var(--dim)}
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--faint)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:15px;background:var(--ink);border:0;border-radius:0;margin-top:-6px}

.footerRow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.action{height:36px;background:transparent;border:1px solid var(--line);color:var(--ink);font-size:7px;letter-spacing:.12em}
footer{display:flex;justify-content:space-between;margin-top:7px;font-size:5.5px;color:var(--dim);letter-spacing:.08em}

@media(max-width:390px){
  .workspace{grid-template-columns:41% 59%;min-height:425px}
  .gen{padding:6px}.observe{padding:6px}
  .typeBtn{font-size:5.2px;min-height:29px}
  #stateText{font-size:10px}
}
</style>
</head>
<body>
<main id="app">
<header>
  <button class="icon" id="audioBtn">▶</button>
  <div><h1>CAT BOX</h1><div class="sub">QUANTUM AUDIO INSTRUMENT / CB-003</div></div>
  <button class="icon" id="reroll">⚄</button>
</header>

<section class="workspace">
  <div class="leftStack">
    <div class="panel gen">
      <div class="genHead"><span>GENERATOR A</span><button class="on" data-gen="A"><i></i></button></div>
      <canvas class="wave" id="waveA" width="160" height="48"></canvas>
      <div class="switches" id="switchA"></div>
    </div>
    <div class="panel gen">
      <div class="genHead"><span>GENERATOR B</span><button class="on" data-gen="B"><i></i></button></div>
      <canvas class="wave" id="waveB" width="160" height="48"></canvas>
      <div class="switches" id="switchB"></div>
    </div>
  </div>

  <div class="panel observe">
    <div class="obsTop">
      <div class="stateBox">
        <div class="label">STATE</div>
        <div id="stateText">SUPERPOSITION</div>
        <div id="stateSub">AUTO OBSERVATION ACTIVE</div>
      </div>
      <div class="probBox">
        <div class="label">PROBABILITY</div>
        <div class="prow"><span>A</span><span id="pa">.34</span><div class="bar"><i id="ba"></i></div></div>
        <div class="prow"><span>B</span><span id="pb">.28</span><div class="bar"><i id="bb"></i></div></div>
        <div class="prow"><span>AB</span><span id="pab">.30</span><div class="bar"><i id="bab"></i></div></div>
        <div class="prow"><span>Ø</span><span id="p0">.08</span><div class="bar"><i id="b0"></i></div></div>
      </div>
    </div>
    <canvas id="eye" width="260" height="72"></canvas>
    <canvas id="box" width="260" height="300"></canvas>
    <div class="observeFoot">
      <div>
        <div class="obsTitle">AUTO OBSERVE</div>
        <div class="obsNote">観測されるたび、箱の中身は少し変わる。</div>
      </div>
      <div class="pulse"><i></i><span>WATCHING</span></div>
    </div>
  </div>
</section>

<section class="panel controls">
  <div class="control">
    <div class="row"><b>UNCERTAINTY</b><span id="uncV">46</span></div>
    <input id="unc" type="range" min="0" max="100" value="46">
  </div>
  <div class="control">
    <div class="row"><b>MEMORY</b><span id="memV">52</span></div>
    <input id="mem" type="range" min="0" max="100" value="52">
  </div>
  <div class="control">
    <div class="row"><b>SPACE</b><span id="spaceV">58</span></div>
    <input id="space" type="range" min="0" max="100" value="58">
  </div>
</section>

<section class="footerRow">
  <button class="action" id="bypass">BYPASS: OFF</button>
  <button class="action" id="mute">MUTE: OFF</button>
</section>
<footer><span>SCHRÖDINGER AUDIO LAB</span><span id="audioState">AUDIO: OFF</span></footer>
</main>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const rr=(a,b)=>b+Math.random()*(a-b);
const TYPES=['PLUCK','DUST','GHOST','DRONE'];

let ctx=null, master, dry, wet, delay, fb, reverb, revGain;
let started=false,bypassed=false,muted=false,observeTimer=null;
let observed=false,collapse='AB';
let probs={A:.34,B:.28,AB:.30,N:.08};
const p={A:{type:'PLUCK',on:true},B:{type:'DUST',on:true},uncertainty:46,memory:52,space:58};
const gens={A:null,B:null};

function makeSwitches(g){
  const root=$('switch'+g);
  TYPES.forEach(t=>{
    const b=document.createElement('button');
    b.className='typeBtn'+(p[g].type===t?' active':'');
    b.textContent=t;
    b.onclick=async()=>{
      await startAudio();p[g].type=t;
      [...root.children].forEach(x=>x.classList.toggle('active',x===b));
      rebuildGen(g);drawWave(g);
    };
    root.append(b);
  });
}
makeSwitches('A');makeSwitches('B');

document.querySelectorAll('.on').forEach(b=>{
  b.onclick=async()=>{
    await startAudio();const g=b.dataset.gen;p[g].on=!p[g].on;
    b.classList.toggle('off',!p[g].on);apply();
  };
});

function initAudio(){
  if(ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
  master=ctx.createGain();master.gain.value=.72;
  dry=ctx.createGain();wet=ctx.createGain();
  delay=ctx.createDelay(2);delay.delayTime.value=.32;
  fb=ctx.createGain();fb.gain.value=.42;
  reverb=ctx.createConvolver();reverb.buffer=impulse(2.5,2.8);
  revGain=ctx.createGain();revGain.gain.value=.38;
  dry.connect(master);wet.connect(delay);delay.connect(fb);fb.connect(delay);delay.connect(reverb);reverb.connect(revGain);revGain.connect(master);master.connect(ctx.destination);
  rebuildGen('A');rebuildGen('B');apply();
}
function impulse(sec,dec){
  const n=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}
  return b;
}
function stopGen(g){
  const q=gens[g];if(!q)return;q.alive=false;if(q.timer)clearTimeout(q.timer);
  (q.nodes||[]).forEach(n=>{try{n.stop&&n.stop()}catch(e){}});
}
function randomPitch(g){
  const base=g==='A'?55:73.4;
  const pool=[1,1.125,1.25,1.333,1.5,1.667,2];
  return base*pool[Math.floor(Math.random()*pool.length)]*Math.pow(2,rr(.04,-.04)*p.uncertainty/100);
}
function rebuildGen(g){
  if(!ctx)return;stopGen(g);
  const obj={alive:true,nodes:[],timer:null};gens[g]=obj;
  const pan=ctx.createStereoPanner();pan.pan.value=g==='A'?-.25:.25;
  if(p[g].type==='DRONE'){
    const gain=ctx.createGain();gain.gain.value=.0001;
    const o1=ctx.createOscillator(),o2=ctx.createOscillator(),g2=ctx.createGain();
    o1.type='sine';o2.type='sine';o1.frequency.value=g==='A'?55:73.4;o2.frequency.value=o1.frequency.value*1.502;g2.gain.value=.32;
    o1.connect(gain);o2.connect(g2).connect(gain);gain.connect(pan);pan.connect(dry);pan.connect(wet);o1.start();o2.start();
    obj.nodes=[o1,o2];obj.gain=gain;obj.oscs=[o1,o2];driftDrone(g);return apply();
  }
  function schedule(){
    if(!obj.alive)return;
    const u=p.uncertainty/100;let wait;
    if(p[g].type==='PLUCK')wait=rr(1900,260)*(1+rr(.5,-.3)*u);
    if(p[g].type==='DUST')wait=rr(760,70)*(1+rr(.7,-.4)*u);
    if(p[g].type==='GHOST')wait=rr(5200,700)*(1+rr(.8,-.3)*u);
    obj.timer=setTimeout(()=>{triggerEvent(g);schedule()},Math.max(45,wait));
  }
  schedule();
}
function triggerEvent(g){
  if(!ctx||!started||!p[g].on||observed&&!stateAllows(g))return;
  const type=p[g].type,t=ctx.currentTime,pan=ctx.createStereoPanner();
  pan.pan.value=clamp((g==='A'?-.35:.35)+rr(.35,-.35)*p.uncertainty/100,-1,1);

  if(type==='PLUCK'){
    const o=ctx.createOscillator(),gain=ctx.createGain(),f=ctx.createBiquadFilter(),bus=ctx.createGain();
    o.type=Math.random()>.82?'triangle':'sine';o.frequency.value=randomPitch(g);
    f.type='lowpass';f.frequency.value=rr(4200,900);
    gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(rr(.16,.07),t+.006);gain.gain.exponentialRampToValueAtTime(.0001,t+rr(1.3,.22));
    o.connect(f).connect(gain).connect(bus);bus.connect(pan);pan.connect(dry);pan.connect(wet);o.start(t);o.stop(t+1.6);
  }
  if(type==='DUST'||type==='GHOST'){
    const dur=type==='DUST'?rr(.10,.012):rr(2.2,.35);
    const n=Math.max(64,Math.floor(ctx.sampleRate*dur)),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),gain=ctx.createGain(),bus=ctx.createGain();
    s.buffer=b;f.type=type==='DUST'?'bandpass':'lowpass';f.frequency.value=type==='DUST'?rr(7800,700):rr(1800,180);f.Q.value=type==='DUST'?rr(11,1):rr(2,.3);
    gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(type==='DUST'?rr(.12,.03):rr(.09,.025),t+.01);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f).connect(gain).connect(bus);bus.connect(pan);pan.connect(dry);pan.connect(wet);s.start(t);s.stop(t+dur+.05);
  }
}
function driftDrone(g){
  const q=gens[g];if(!q||!q.alive||p[g].type!=='DRONE')return;
  const base=g==='A'?55:73.4,u=p.uncertainty/100,t=ctx.currentTime;
  q.oscs[0].frequency.setTargetAtTime(base*Math.pow(2,rr(.12,-.12)*u),t,2.2);
  q.oscs[1].frequency.setTargetAtTime(base*1.502*Math.pow(2,rr(.08,-.08)*u),t,2.7);
  q.timer=setTimeout(()=>driftDrone(g),rr(6500,1800));
}
function stateAllows(g){return collapse==='AB'||collapse===g}
function apply(){
  if(!ctx)return;
  ['A','B'].forEach(g=>{
    const q=gens[g];if(!q)return;
    if(q.gain){
      const allowed=!observed||stateAllows(g);
      q.gain.gain.setTargetAtTime(p[g].on&&allowed?.045:.0001,ctx.currentTime,.22);
    }
  });
  const mem=p.memory/100,space=p.space/100;
  fb.gain.setTargetAtTime(.12+mem*.70,ctx.currentTime,.1);
  delay.delayTime.setTargetAtTime(.12+mem*.52,ctx.currentTime,.1);
  wet.gain.setTargetAtTime(.14+space*.66,ctx.currentTime,.1);
  dry.gain.setTargetAtTime(.9-space*.32,ctx.currentTime,.1);
  revGain.gain.setTargetAtTime(.06+space*.68,ctx.currentTime,.1);
  master.gain.setTargetAtTime((bypassed||muted)?0:.72,ctx.currentTime,.05);
}
function randomizeProbs(){
  const u=p.uncertainty/100;
  let vals=[rr(.52,.18),rr(.52,.18),rr(.28+.38*u,.10),rr(.08+.15*u,.025)];
  const s=vals.reduce((a,b)=>a+b,0);vals=vals.map(v=>v/s);probs={A:vals[0],B:vals[1],AB:vals[2],N:vals[3]};
  [['A','pa','ba'],['B','pb','bb'],['AB','pab','bab'],['N','p0','b0']].forEach(([k,t,b])=>{
    $(t).textContent=probs[k].toFixed(2).replace(/^0/,'');$(b).style.width=(probs[k]*100)+'%';
  });
}
function collapseNow(){
  observed=true;const r=Math.random(),a=probs.A,b=a+probs.B,ab=b+probs.AB;
  collapse=r<a?'A':r<b?'B':r<ab?'AB':'N';
  const txt={A:'A EXISTS',B:'B EXISTS',AB:'A + B',N:'VACUUM'};
  $('stateText').textContent=txt[collapse];$('stateSub').textContent='WAVEFUNCTION COLLAPSED';apply();drawBox();
  setTimeout(()=>{observed=false;$('stateText').textContent='SUPERPOSITION';$('stateSub').textContent='AUTO OBSERVATION ACTIVE';apply();drawBox()},rr(1500,650));
}
function scheduleObserve(){
  clearTimeout(observeTimer);
  const wait=rr(5200,2200)*(1+(1-p.uncertainty/100)*.35);
  observeTimer=setTimeout(()=>{randomizeProbs();collapseNow();setTimeout(scheduleObserve,rr(1100,450))},wait);
}
async function startAudio(){
  initAudio();if(ctx.state!=='running')await ctx.resume();started=true;$('audioBtn').textContent='Ⅱ';$('audioState').textContent='AUDIO: '+ctx.state.toUpperCase();
}
$('audioBtn').onclick=async()=>{
  initAudio();
  if(ctx.state==='running'){await ctx.suspend();started=false;$('audioBtn').textContent='▶'}
  else{await ctx.resume();started=true;$('audioBtn').textContent='Ⅱ'}
  $('audioState').textContent='AUDIO: '+ctx.state.toUpperCase();
};
$('reroll').onclick=async()=>{await startAudio();randomizeProbs();if(Math.random()>.5)collapseNow()};
$('bypass').onclick=()=>{bypassed=!bypassed;$('bypass').textContent='BYPASS: '+(bypassed?'ON':'OFF');apply()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent='MUTE: '+(muted?'ON':'OFF');apply()};
[['unc','uncertainty','uncV'],['mem','memory','memV'],['space','space','spaceV']].forEach(([id,key,out])=>{
  $(id).oninput=e=>{p[key]=+e.target.value;$(out).textContent=p[key];apply()};
});

function ln(x,a,b,c,d,alpha=1){x.globalAlpha=alpha;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}
function cat(x,ox,alpha,dash=false){
  x.save();x.translate(ox,0);x.globalAlpha=alpha;x.strokeStyle='#f4f4ef';x.lineWidth=1;if(dash)x.setLineDash([2,4]);
  x.beginPath();x.arc(0,-20,18,0,Math.PI*2);x.stroke();
  x.beginPath();x.moveTo(-13,-34);x.lineTo(-17,-51);x.lineTo(-3,-38);x.moveTo(13,-34);x.lineTo(17,-51);x.lineTo(3,-38);x.stroke();
  x.beginPath();x.ellipse(0,20,22,39,0,0,Math.PI*2);x.stroke();
  x.beginPath();x.moveTo(16,36);x.quadraticCurveTo(38,34,33,12);x.stroke();
  ln(x,-7,-20,-3,-20);ln(x,3,-20,7,-20);ln(x,-3,-11,3,-11);x.restore();
}
function drawEye(){
  const c=$('eye'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.strokeStyle='#f4f4ef';x.lineWidth=1;
  x.beginPath();x.moveTo(28,h/2);x.quadraticCurveTo(w/2,-4,w-28,h/2);x.quadraticCurveTo(w/2,h+4,28,h/2);x.stroke();
  for(let i=1;i<6;i++){x.globalAlpha=.12+i*.08;x.beginPath();x.ellipse(w/2,h/2,i*18,7+i*2,0,0,Math.PI*2);x.stroke()}
  x.globalAlpha=1;x.beginPath();x.arc(w/2,h/2,10,0,Math.PI*2);x.stroke();
}
function drawBox(){
  const c=$('box'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.strokeStyle='#f4f4ef';x.lineWidth=1;
  x.globalAlpha=.52;x.strokeRect(18,30,w-36,h-48);x.strokeRect(32,17,w-64,h-48);
  ln(x,18,30,32,17);ln(x,w-18,30,w-32,17);ln(x,18,h-18,32,h-31);ln(x,w-18,h-18,w-32,h-31);
  for(let i=0;i<5;i++)ln(x,20,51+i*42,w-20,51+i*42,.08);
  x.save();x.translate(w/2,h/2+12);
  if(!observed){cat(x,-16,.92,false);cat(x,16,.34,true)}
  else if(collapse==='A')cat(x,-5,1,false);
  else if(collapse==='B')cat(x,5,.85,true);
  else if(collapse==='AB'){cat(x,-13,.9,false);cat(x,13,.5,true)}
  else{x.globalAlpha=.6;x.fillStyle='#f4f4ef';x.font='13px Courier New';x.textAlign='center';x.fillText('∅',0,0)}
  x.restore();x.setLineDash([3,4]);ln(x,w/2,22,w/2,h-20,.25);x.setLineDash([]);
}
function drawWave(g){
  const c=$('wave'+g),x=c.getContext('2d'),w=c.width,h=c.height,t=p[g].type;x.clearRect(0,0,w,h);x.strokeStyle='#f4f4ef';x.lineWidth=1;x.globalAlpha=.72;x.beginPath();
  for(let i=0;i<w;i++){
    const q=i/w,ph=q*Math.PI*8;let v=0;
    if(t==='PLUCK')v=Math.sin(ph*1.35)*Math.exp(-(q*3%3));
    if(t==='DUST')v=Math.random()>.9?(Math.random()*2-1):0;
    if(t==='GHOST')v=(Math.sin(ph*.55)+Math.sin(ph*1.9)*.28)*.45;
    if(t==='DRONE')v=Math.sin(ph*.45)*.65+Math.sin(ph*.71)*.18;
    const y=h/2-v*h*.34;i?x.lineTo(i,y):x.moveTo(i,y);
  }x.stroke();x.globalAlpha=1;
}
function animate(){drawEye();drawBox();drawWave('A');drawWave('B');requestAnimationFrame(animate)}
randomizeProbs();scheduleObserve();animate();
</script>
</body>
</html>
